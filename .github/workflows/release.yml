name: Release

on:
  push:
    branches:
      - main
  # Ручной запуск релиза из вкладки Actions (без push в main).
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Bump version and create a tag ─────────────────────────────────────────
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next patch version
        id: bump
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          echo "Current version in package.json: $CURRENT"

          # Проверяем наличие релиза с таким тегом в публичном репо релизов.
          # Источник истины именно он — там лежат все опубликованные версии.
          # Если релиз уже есть — бампаем patch на 1 и идём вверх пока не найдём
          # свободную версию (защита от двойных запусков на одну версию).
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_VERSION="$CURRENT"

          while gh release view "v$NEW_VERSION" --repo alexIV-0/fs.manager.releases >/dev/null 2>&1; do
            echo "Release v$NEW_VERSION already exists, bumping patch"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          done

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "

          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, '\t') + '\n');
          "

          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

          # Cargo.lock держим в синхроне: при бампе меняется только версия
          # самого крейта fs-manager-tauri (зависимости не трогаются)
          sed -i "/^name = \"fs-manager-tauri\"/{n;s/^version = \".*\"/version = \"$NEW_VERSION\"/}" src-tauri/Cargo.lock

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "Nothing to commit"
          git push

  # ── Build for all platforms ────────────────────────────────────────────────
  build:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact-suffix: aarch64
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact-suffix: x86_64
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
            artifact-suffix: windows
            rust-target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Кэш yarn-зависимостей (ключ по yarn.lock) — install не качает пакеты заново.
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Только нужный для этой строки матрицы таргет (на Windows — пусто, host msvc).
          targets: ${{ matrix.rust-target }}

      # Кэш Rust: ~/.cargo + src-tauri/target. Холодная Tauri-сборка компилит сотни
      # крейтов (5–15 мин); кэш экономит большую часть на повторных релизах.
      # key по платформе+таргету, чтобы aarch64/x86_64/windows не клобберили друг друга.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact-suffix }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos-latest'
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
          SUFFIX: ${{ matrix.artifact-suffix }}
        run: |
          mkdir artifacts
          # DMG-инсталлеры — у них уже есть архитектурный суффикс
          find src-tauri/target -name "*.dmg" -exec cp {} artifacts/ \;
          # .app.tar.gz и .sig — tauri называет их fsManager.app.tar.gz без суффикса,
          # поэтому aarch64 и x64 артефакты сталкиваются. Переименовываем при копировании.
          for f in $(find src-tauri/target -name "fsManager.app.tar.gz"); do
            cp "$f" "artifacts/fsManager_${VERSION}_${SUFFIX}.app.tar.gz"
          done
          for f in $(find src-tauri/target -name "fsManager.app.tar.gz.sig"); do
            cp "$f" "artifacts/fsManager_${VERSION}_${SUFFIX}.app.tar.gz.sig"
          done

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          # NSIS .exe + .sig — имена уже содержат версию, не пересекаются между матрицей
          Get-ChildItem -Recurse src-tauri\target\release\bundle -Include "*.exe","*.exe.sig" | Copy-Item -Destination artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-suffix }}
          path: artifacts/
          retention-days: 1

  # ── Publish release to public releases repo ────────────────────────────────
  publish:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected files
        run: find artifacts -type f | sort

      # Собираем latest.json со склееными подписями для всех платформ.
      # Этот файл читает native tauri-plugin-updater при вызове check().
      # Без него update-чек возвращает 404 → "нет обновлений".
      - name: Generate latest.json
        env:
          TAG: ${{ needs.bump-version.outputs.tag }}
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          BASE="https://github.com/alexIV-0/fs.manager.releases/releases/download/$TAG"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          SIG_ARM_FILE="artifacts/fsManager_${VERSION}_aarch64.app.tar.gz.sig"
          SIG_X64_FILE="artifacts/fsManager_${VERSION}_x86_64.app.tar.gz.sig"
          SIG_WIN_FILE="artifacts/fsManager_${VERSION}_x64-setup.exe.sig"

          # Если какого-то .sig нет — создаём пустой, чтобы jq не упал.
          # Native updater на такой платформе откажет в установке (пустая подпись
          # не проходит проверку minisign), но релиз опубликуется и остальные
          # платформы будут работать.
          for f in "$SIG_ARM_FILE" "$SIG_X64_FILE" "$SIG_WIN_FILE"; do
            if [ ! -f "$f" ]; then
              echo "::warning::missing signature file: $f — native updater для этой платформы не сработает"
              touch "$f"
            fi
          done

          # jq --rawfile читает файл целиком и экранирует его как валидную JSON-строку
          # (включая переводы строк в multi-line .sig из minisign).
          jq -n \
            --arg version "$VERSION" \
            --arg notes "fsManager $VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg url_arm "$BASE/fsManager_${VERSION}_aarch64.app.tar.gz" \
            --arg url_x64 "$BASE/fsManager_${VERSION}_x86_64.app.tar.gz" \
            --arg url_win "$BASE/fsManager_${VERSION}_x64-setup.exe" \
            --rawfile sig_arm "$SIG_ARM_FILE" \
            --rawfile sig_x64 "$SIG_X64_FILE" \
            --rawfile sig_win "$SIG_WIN_FILE" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $sig_arm, url: $url_arm },
                "darwin-x86_64":  { signature: $sig_x64, url: $url_x64 },
                "windows-x86_64": { signature: $sig_win, url: $url_win }
              }
            }' > artifacts/latest.json

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          TAG="${{ needs.bump-version.outputs.tag }}"
          VERSION="${{ needs.bump-version.outputs.version }}"
          # -size +0c: GitHub Uploads API отвечает 400 Bad Content-Length на 0-байтовые файлы.
          # Пустышки могут появиться из шага latest.json, который touch-ит отсутствующие .sig для jq.
          FILES=$(find artifacts -type f -size +0c | tr '\n' ' ')
          gh release create "$TAG" \
            --repo alexIV-0/fs.manager.releases \
            --title "fsManager $VERSION" \
            --notes "## fsManager $VERSION" \
            $FILES
