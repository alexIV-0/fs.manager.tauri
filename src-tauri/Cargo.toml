[package]
name = "fs-manager-tauri"
version = "0.2.0"
description = "fsManager - File System Manager with Tauri"
authors = ["alexIV"]
edition = "2021"

[lib]
name = "fs_manager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
notify = "6"
uuid = { version = "1", features = ["v4"] }
pathdiff = "0.2"
dirs = "5"
url = "2"
zip = "0.6"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "net", "io-util", "fs"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }
filetime = "0.2"
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-drag = "2.1.1"
systemicons = "0.9.13"
base64 = "0.22.1"
# tauri-specta: типобезопасные TS-биндинги (export-only стадия, см. SPECTA_MIGRATION_PLAN.md)
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
